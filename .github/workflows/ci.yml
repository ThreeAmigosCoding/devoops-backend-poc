name: CI Pipeline

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'


env:
  DOCKERHUB_USERNAME: threeamigoscoding

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Run tests
        run: ./gradlew test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build/libs/*.jar
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: gcr.io/kaniko-project/executor:debug
      options: --entrypoint ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: build/libs

      - name: Generate version tag
        id: version
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            VERSION_TAG=$(echo "$GITHUB_REF" | sed 's|refs/tags/v||')
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
            VERSION_TAG="main-${SHORT_SHA}"
          else
            SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
            VERSION_TAG="develop-${SHORT_SHA}"
          fi
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Set up Kaniko Docker config
        run: |
          mkdir -p /kaniko/.docker
          echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"$(echo -n $DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN | base64)\"}}}" > /kaniko/.docker/config.json
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image with Kaniko
        run: |
          /kaniko/executor \
            --context=$GITHUB_WORKSPACE \
            --dockerfile=$GITHUB_WORKSPACE/Dockerfile \
            --destination=${{ env.DOCKERHUB_USERNAME }}/devoops-backend-poc:${{ steps.version.outputs.tag }} \
            --destination=${{ env.DOCKERHUB_USERNAME }}/devoops-backend-poc:latest \
            --cache=true \
            --cache-repo=${{ env.DOCKERHUB_USERNAME }}/devoops-backend-poc-cache